<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 130 764 764" width="1024" height="1024">
  <!-- Abacus Board: an abacus whose beads climb like a rising bar chart. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26305F"/>
      <stop offset="0.55" stop-color="#151A3A"/>
      <stop offset="1" stop-color="#0A0D1F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#FF7A45" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FF7A45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A3"/>
      <stop offset="0.45" stop-color="#F2BE4A"/>
      <stop offset="1" stop-color="#C98418"/>
    </linearGradient>
    <linearGradient id="frameIn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A4A08"/>
      <stop offset="1" stop-color="#B9791A"/>
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A25A"/>
      <stop offset="0.5" stop-color="#FFF1CC"/>
      <stop offset="1" stop-color="#B98E44"/>
    </linearGradient>
    <linearGradient id="bead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB27E"/>
      <stop offset="0.5" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#D2480E"/>
    </linearGradient>
    <linearGradient id="beadTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4C8"/>
      <stop offset="0.5" stop-color="#FFD25A"/>
      <stop offset="1" stop-color="#D99512"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="beadShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#3A1203" flood-opacity="0.55"/>
    </filter>
    <symbol id="b" viewBox="-60 -36 120 72" overflow="visible">
      <rect x="-58" y="-34" width="116" height="68" rx="34" fill="url(#bead)"/>
      <rect x="-46" y="-26" width="70" height="16" rx="8" fill="#FFFFFF" opacity="0.38"/>
    </symbol>
    <symbol id="bt" viewBox="-60 -36 120 72" overflow="visible">
      <rect x="-58" y="-34" width="116" height="68" rx="34" fill="url(#beadTop)"/>
      <rect x="-46" y="-26" width="70" height="16" rx="8" fill="#FFFFFF" opacity="0.55"/>
    </symbol>
  </defs>


  <g filter="url(#shadow)">
    <!-- frame -->
    <rect x="150" y="150" width="724" height="724" rx="84" fill="url(#frame)"/>
    <rect x="202" y="202" width="620" height="620" rx="38" fill="#0E1230"/>
    <rect x="202" y="202" width="620" height="620" rx="38" fill="none" stroke="url(#frameIn)" stroke-width="6"/>
  </g>
  <path d="M234 166 H790 Q858 166 858 234" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round"/>

  <!-- rods -->
  <g>
    <rect x="273.5" y="202" width="12" height="620" fill="url(#rod)"/>
    <rect x="428.5" y="202" width="12" height="620" fill="url(#rod)"/>
    <rect x="583.5" y="202" width="12" height="620" fill="url(#rod)"/>
    <rect x="738.5" y="202" width="12" height="620" fill="url(#rod)"/>
  </g>

  <!-- beads: 1, 2, 3, 5 climbing to the right; the top bead is gold -->
  <g filter="url(#beadShadow)">
    <use href="#b" x="215.5" y="748" width="128" height="76"/>
    <use href="#b" x="370.5" y="748" width="128" height="76"/>
    <use href="#b" x="370.5" y="670" width="128" height="76"/>
    <use href="#b" x="525.5" y="748" width="128" height="76"/>
    <use href="#b" x="525.5" y="670" width="128" height="76"/>
    <use href="#b" x="525.5" y="592" width="128" height="76"/>
    <use href="#b" x="680.5" y="748" width="128" height="76"/>
    <use href="#b" x="680.5" y="670" width="128" height="76"/>
    <use href="#b" x="680.5" y="592" width="128" height="76"/>
    <use href="#b" x="680.5" y="514" width="128" height="76"/>
    <use href="#bt" x="680.5" y="436" width="128" height="76"/>
  </g>
</svg>
