{% extends "base.html" %}
{% block content %}
  <h2>Record a Sale</h2>
  {% if products %}
  <form class="card" method="post">
    <label for="product_id">Product</label>
    <select id="product_id" name="product_id" required>
      {% for p in products %}
      <option value="{{ p.id }}">{{ p.name }} (${{ "%.2f"|format(p.price) }})</option>
      {% endfor %}
    </select>

    <label for="customer_id">Customer (optional)</label>
    <select id="customer_id" name="customer_id">
      <option value="">Unknown Customer</option>
      {% for c in customers %}
      <option value="{{ c.id }}">{{ c.name }}</option>
      {% endfor %}
    </select>

    <label for="source">Sale source</label>
    <select id="source" name="source">
      {% for s in sources %}
      <option value="{{ s }}">{{ s }}</option>
      {% endfor %}
    </select>

    <label for="quantity">Quantity sold</label>
    <input type="number" id="quantity" name="quantity" min="1" value="1" required>

    <label for="discount_percent">Discount (%)</label>
    <input type="number" id="discount_percent" name="discount_percent" min="0" max="100" step="0.1" value="0">

    <label for="sale_date">Date</label>
    <input type="date" id="sale_date" name="sale_date" value="{{ today }}">

    <button type="submit">Save Sale</button>
  </form>
  {% else %}
    <p>You need to add a product first. <a href="{{ url_for('add_product') }}">Add one now</a>.</p>
  {% endif %}
{% endblock %}
