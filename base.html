<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sales Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #22c55e;
      --blue: #38bdf8;
      --red: #ef4444;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    header {
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { margin: 0; font-size: 1.3rem; white-space: nowrap; }
    nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    nav.tabs a {
      color: var(--muted);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    nav.tabs a.active { background: var(--card); color: var(--blue); }
    header .actions a {
      color: var(--text);
      text-decoration: none;
      margin-left: 8px;
      padding: 8px 14px;
      border-radius: 6px;
      background: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }
    header .actions a.secondary { background: var(--blue); color: #04263a; }
    main { padding: 24px 32px; max-width: 960px; margin: 0 auto; }
    .stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      flex: 1;
      min-width: 140px;
    }
    .stat-card .label { color: var(--muted); font-size: 0.85rem; }
    .stat-card .value { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
    .stat-card .value.positive { color: var(--accent); }
    .stat-card .value.negative { color: var(--red); }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
    th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    form.card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      max-width: 420px;
    }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 0.85rem; }
    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      font-size: 0.95rem;
    }
    button {
      background: var(--accent);
      color: #052e16;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .delete-btn {
      background: transparent;
      border: 1px solid var(--red);
      color: var(--red);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .empty { color: var(--muted); padding: 24px 0; text-align: center; }
    h2 { margin-top: 0; }
    .month-heading {
      color: var(--blue);
      font-size: 1.1rem;
      font-weight: 700;
      margin: 24px 0 4px;
    }
    .month-total {
      display: flex;
      justify-content: space-between;
      background: #16233a;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 700;
      margin-top: 4px;
    }
    .chip {
      display: inline-block;
      background: #16233a;
      color: var(--blue);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
    }
    .panel h3 { margin-top: 0; font-size: 0.95rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
    .rank-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .rank-row:last-child { border-bottom: none; }
    .bar-chart { display: flex; align-items: flex-end; gap: 16px; height: 160px; padding: 8px 0; }
    .bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; flex: 1; height: 100%; }
    .bar { width: 60%; background: var(--blue); border-radius: 4px 4px 0 0; }
    .bar-label { color: var(--muted); font-size: 0.75rem; margin-top: 6px; }
    .bar-value { color: var(--text); font-size: 0.75rem; margin-bottom: 4px; }
    @media (max-width: 640px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📊 Sales Tracker</h1>
    <nav class="tabs">
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if active == 'home' else '' }}">Home</a>
      <a href="{{ url_for('list_sales') }}" class="{{ 'active' if active == 'sales' else '' }}">Sales</a>
      <a href="{{ url_for('list_expenses') }}" class="{{ 'active' if active == 'expenses' else '' }}">Expenses</a>
      <a href="{{ url_for('list_customers') }}" class="{{ 'active' if active == 'customers' else '' }}">Customers</a>
      <a href="{{ url_for('list_products') }}" class="{{ 'active' if active == 'products' else '' }}">Products</a>
    </nav>
    <div class="actions">
      <a class="secondary" href="{{ url_for('add_expense') }}">+ Expense</a>
      <a href="{{ url_for('add_sale') }}">+ Sale</a>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
